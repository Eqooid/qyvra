# Default Docker namespace. Existing volumes can be mapped explicitly below.
name: qyvra

x-database: &database
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # Keep the old hostname when reusing RabbitMQ's persisted Erlang node data.
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-qyvra}
      # Existing local .env files keep working; set a dedicated secret for deployments.
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Processing progress is disposable; no Redis persistence is required.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [vector]
    # No host ports or Nginx route. Bash is present in the pinned upstream image.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r response <&3; [[ $$response == *' 200 '* ]]",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migration
    environment: *database
    init: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    networks: [default, vector]
    environment:
      <<: *database
      # Compiled application, but HTTP-local cookie policy. Production validation stays strict.
      NODE_ENV: ${NODE_ENV:-development}
      HTTP_HOST: 0.0.0.0
      AI_INGESTION_ENABLED: ${AI_INGESTION_ENABLED:-false}
      AI_INGESTION_PROFILE_FINGERPRINT: ${AI_INGESTION_PROFILE_FINGERPRINT:-}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-false}
      SEMANTIC_SEARCH_MIN_SCORE: ${SEMANTIC_SEARCH_MIN_SCORE:-}
      SEMANTIC_SEARCH_MAX_MANIFESTS: ${SEMANTIC_SEARCH_MAX_MANIFESTS:-250}
      SEMANTIC_SEARCH_TIMEOUT_MS: ${SEMANTIC_SEARCH_TIMEOUT_MS:-35000}
      SEMANTIC_SEARCH_CONCURRENCY: ${SEMANTIC_SEARCH_CONCURRENCY:-4}
      SEMANTIC_SEARCH_USER_PER_MINUTE: ${SEMANTIC_SEARCH_USER_PER_MINUTE:-30}
      SEMANTIC_SEARCH_GLOBAL_PER_MINUTE: ${SEMANTIC_SEARCH_GLOBAL_PER_MINUTE:-300}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_MAX_SOURCES: ${RAG_MAX_SOURCES:-8}
      RAG_PER_DOCUMENT_SOURCES: ${RAG_PER_DOCUMENT_SOURCES:-3}
      RAG_CONTEXT_TOKENS: ${RAG_CONTEXT_TOKENS:-8192}
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-60000}
      RAG_CONCURRENCY: ${RAG_CONCURRENCY:-2}
      RAG_USER_PER_MINUTE: ${RAG_USER_PER_MINUTE:-10}
      RAG_GLOBAL_PER_MINUTE: ${RAG_GLOBAL_PER_MINUTE:-100}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-openai-compatible}
      GENERATION_TOKENIZER: ${GENERATION_TOKENIZER:-o200k_base}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_ENDPOINT: ${GENERATION_ENDPOINT:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_ALLOW_HTTP: ${GENERATION_ALLOW_HTTP:-false}
      GENERATION_TIMEOUT_MS: ${GENERATION_TIMEOUT_MS:-25000}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-1024}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0}
      GENERATION_OUTPUT_TOKEN_FIELD: ${GENERATION_OUTPUT_TOKEN_FIELD:-max_completion_tokens}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      # Query serving may retain an older profile while the worker indexes a replacement.
      EMBEDDING_PROFILE_FINGERPRINT: ${SEMANTIC_SEARCH_PROFILE_FINGERPRINT:-${EMBEDDING_PROFILE_FINGERPRINT:-}}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_ALLOW_HTTP: ${EMBEDDING_ALLOW_HTTP:-false}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-8191}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-true}
      VECTOR_INDEX_ENABLED: ${VECTOR_INDEX_ENABLED:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_ALLOW_HTTP: ${QDRANT_ALLOW_HTTP:-true}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-10000}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-512}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-64}
      PORT: "3001"
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: /data/qyvra
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PROCESSING_PROGRESS_TTL_SECONDS: ${PROCESSING_PROGRESS_TTL_SECONDS:-180}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:8080}
      CORS_CREDENTIALS: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: lax
      COOKIE_PATH: /
      COOKIE_REFRESH_PATH: /api/v1/auth
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      UPLOAD_MAX_PAGES: ${UPLOAD_MAX_PAGES:-500}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-40000000}
      UPLOAD_TIMEOUT_MS: ${UPLOAD_TIMEOUT_MS:-120000}
      UPLOAD_INSPECTION_TIMEOUT_MS: ${UPLOAD_INSPECTION_TIMEOUT_MS:-15000}
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-2}
    volumes:
      - storage_data:/data/qyvra
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/data/qyvra', 6); fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  outbox:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    command: ["node", "/app/infrastructure/docker/outbox-command.cjs"]
    init: true
    restart: unless-stopped
    environment:
      <<: *database
      NODE_ENV: ${NODE_ENV:-development}
      LOCAL_STORAGE_ROOT: /data/qyvra
      RABBITMQ_USER: ${RABBITMQ_USER:-qyvra}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-120000}
      PROCESSING_RECOVERY_POLL_INTERVAL_MS: ${PROCESSING_RECOVERY_POLL_INTERVAL_MS:-5000}
      PROCESSING_RECOVERY_BATCH_SIZE: ${PROCESSING_RECOVERY_BATCH_SIZE:-10}
      RABBITMQ_CONNECT_TIMEOUT_MS: ${RABBITMQ_CONNECT_TIMEOUT_MS:-5000}
      RABBITMQ_CONFIRM_TIMEOUT_MS: ${RABBITMQ_CONFIRM_TIMEOUT_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    networks: [default, vector]
    # Heap caps apply per parser; this cgroup also bounds aggregate/native RSS.
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    command: ["node", "/app/infrastructure/docker/worker-command.cjs"]
    init: true
    restart: unless-stopped
    environment:
      <<: *database
      NODE_ENV: ${NODE_ENV:-development}
      LOCAL_STORAGE_ROOT: /data/qyvra
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PROCESSING_PROGRESS_TTL_SECONDS: ${PROCESSING_PROGRESS_TTL_SECONDS:-180}
      RABBITMQ_USER: ${RABBITMQ_USER:-qyvra}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-2}
      AI_INGESTION_ENABLED: ${AI_INGESTION_ENABLED:-false}
      AI_INGESTION_PROFILE_FINGERPRINT: ${AI_INGESTION_PROFILE_FINGERPRINT:-}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_PROFILE_FINGERPRINT: ${EMBEDDING_PROFILE_FINGERPRINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_ALLOW_HTTP: ${EMBEDDING_ALLOW_HTTP:-false}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-8191}
      EMBEDDING_MAX_BATCH_TOKENS: ${EMBEDDING_MAX_BATCH_TOKENS:-100000}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-true}
      VECTOR_INDEX_ENABLED: ${VECTOR_INDEX_ENABLED:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_ALLOW_HTTP: ${QDRANT_ALLOW_HTTP:-true}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-10000}
      VECTOR_INDEX_BATCH_SIZE: ${VECTOR_INDEX_BATCH_SIZE:-64}
      WORKER_JOB_LEASE_MS: ${WORKER_JOB_LEASE_MS:-120000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      UPLOAD_MAX_PAGES: ${UPLOAD_MAX_PAGES:-500}
      PDF_EXTRACTION_MAX_BYTES: ${PDF_EXTRACTION_MAX_BYTES:-${UPLOAD_MAX_BYTES:-52428800}}
      PDF_EXTRACTION_MAX_PAGES: ${PDF_EXTRACTION_MAX_PAGES:-${UPLOAD_MAX_PAGES:-500}}
      PDF_EXTRACTION_MAX_CHARACTERS: ${PDF_EXTRACTION_MAX_CHARACTERS:-5000000}
      PDF_EXTRACTION_MAX_TEXT_BYTES: ${PDF_EXTRACTION_MAX_TEXT_BYTES:-20000000}
      PDF_EXTRACTION_TIMEOUT_MS: ${PDF_EXTRACTION_TIMEOUT_MS:-30000}
      PDF_EXTRACTION_HEAP_MB: ${PDF_EXTRACTION_HEAP_MB:-256}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-512}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-64}
      CHUNK_MAX_COUNT: ${CHUNK_MAX_COUNT:-10000}
      CHUNK_MAX_OUTPUT_BYTES: ${CHUNK_MAX_OUTPUT_BYTES:-40000000}
      CHUNK_TIMEOUT_MS: ${CHUNK_TIMEOUT_MS:-30000}
      WORKER_RECONNECT_DELAY_MS: ${WORKER_RECONNECT_DELAY_MS:-1000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      RABBITMQ_CONNECT_TIMEOUT_MS: ${RABBITMQ_CONNECT_TIMEOUT_MS:-5000}
    volumes:
      - storage_data:/data/qyvra:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.exit(require('node:fs').existsSync('/tmp/qyvra-worker-ready')?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
    restart: unless-stopped
    environment:
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      NGINX_ENVSUBST_FILTER: ^NGINX_MAX_BODY_BYTES
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/api/v1/health/ready && wget -q -O /dev/null http://127.0.0.1/login",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

# Default bridge network is project-private; only Nginx publishes a port.
networks:
  default:
    driver: bridge
  vector:
    driver: bridge
    internal: true
volumes:
  qdrant_data:
    name: ${QDRANT_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_qdrant_data}
    # Qdrant is new in Phase 4; legacy external-volume mode must not prevent creation.
    external: ${QDRANT_VOLUME_EXTERNAL:-false}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_postgres_data}
    external: ${PERSISTENT_VOLUMES_EXTERNAL:-false}
  storage_data:
    name: ${STORAGE_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_storage_data}
    external: ${PERSISTENT_VOLUMES_EXTERNAL:-false}
  rabbitmq_data:
    name: ${RABBITMQ_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_rabbitmq_data}
    external: ${PERSISTENT_VOLUMES_EXTERNAL:-false}
