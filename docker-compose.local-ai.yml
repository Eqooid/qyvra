# Optional operator-provisioned assets and private provider-container network.
# Always load AFTER docker-compose.yml; no inference service or model download.
services:
  api:
    volumes:
      - type: bind
        source: ${LOCAL_AI_ASSETS_DIR:?Set LOCAL_AI_ASSETS_DIR to an existing certified asset directory}
        target: /run/qyvra-ai
        read_only: true
        bind:
          create_host_path: false
    networks: [default, vector, ai_provider]
  worker:
    volumes:
      - type: bind
        source: ${LOCAL_AI_ASSETS_DIR:?Set LOCAL_AI_ASSETS_DIR to an existing certified asset directory}
        target: /run/qyvra-ai
        read_only: true
        bind:
          create_host_path: false
    networks: [default, vector, ai_provider]
networks:
  ai_provider:
    internal: true
